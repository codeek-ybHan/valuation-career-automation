name: Valuation Big4 Weekly

on:
  schedule:
    # KST 금요일 08:00 = UTC 목요일 23:00
    - cron: "0 23 * * 4"
  workflow_dispatch:
    inputs:
      deliver:
        description: '실제 Notion 저장 및 Gmail 발송'
        type: boolean
        default: false


permissions:
  contents: read

concurrency:
  group: valuation-delivery
  cancel-in-progress: false

defaults:
  run:
    working-directory: valuation-career-automation

jobs:
  big4:
    if: (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_DELIVERY == 'true') || (github.event_name == 'workflow_dispatch' && inputs.deliver)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: valuation-career-automation/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore processed.db
        uses: actions/cache@v4
        with:
          path: valuation-career-automation/data/processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: processed-db-

      - run: python main.py big4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_INTELLIGENCE_DB_ID: ${{ secrets.NOTION_INTELLIGENCE_DB_ID }}
          NOTION_INTERVIEW_DB_ID: ${{ secrets.NOTION_INTERVIEW_DB_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Save delivery queue (including partial failures)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: valuation-career-automation/data/processed.db
          key: processed-db-${{ github.run_id }}-${{ github.run_attempt }}
